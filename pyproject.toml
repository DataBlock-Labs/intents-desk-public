[project]
name = "intents-desk"
version = "0.1.0"
description = "Where's my swap? Open data and an agent for NEAR Intents."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "duckdb>=1.1",
]

[project.scripts]
intents-desk = "intents_desk.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
markers = [
    "integration: runs the CLI and server against fake APIs (slower)",
    "live: calls the real public APIs (opt-in: pytest -m live)",
    "e2e: browser tests with Playwright against a running server",
]
addopts = "-m 'not live and not e2e'"
